<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       
        header{
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
            color: white;

        }

        nav a{
            margin-right: 20px;
            color: white;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;

        }

        .banner
        {
            background-color: rgb(37, 37, 131);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .banner p{
            margin-top: 20px;
        }
        button
        {
            margin-top: 20px;
            padding: 20px;
        }

        main{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: 200px 200px 200px;
            gap: 30px;
            margin: 10px;
        }

        .box
        {
            border: 2px solid black;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-image: url(./images/avangers-endgame.jpg);
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .box p{
            margin: 20px;
            position: absolute;
            bottom: 0;
            
        }

        .wide
        {
            grid-column: 1/3;
        }


        .tall
        {
            grid-row: 2/4;
        }

        .large
        {
            grid-column: 3/5;
        }

        footer
        {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h2>TravelX</h2>

        <nav>
            <a href="">Home</a>
            <a href="">Destinations</a>
            <a href="">Packages</a>
            <a href="">Contact</a>
        </nav>
    </header>

    <div class="banner">
        <h1>Eplore the world </h1>
        <p>Discover beautiful destinations and create unforgottable memories</p>
        <button>Book</button>

    </div>

    <main>
        <div class="box wide">
            <p>Paris</p>
        </div>

        <div class="box">
            <p>Dubai</p>
        </div>

        <div class="box">
            <p>London</p>
        </div>

        <div class="box tall">
            <p>Tokyo</p>
        </div>

        <div class="box">
            <p>Sigapoor</p>
        </div>

        <div class="box">
            <p>Maldives</p>
        </div>

        <div class="box large">
            <p>Switzerland</p>
        </div>
    </main>

    <footer>
        <p>&copy;2026 TravelX</p>
    </footer>
</body>
</html>
