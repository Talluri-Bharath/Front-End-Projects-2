
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>LEAVEX - Employee Leave Management</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./Glossy_Levex_Leave_Management_Logo.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

    <header>

        <h1>
            <i class="bi bi-calendar-check"></i>
            LEAVEX
        </h1>

        <h3>Employee Leave Management System</h3>

    </header>

    <main>
        <h1>Welcome to LEAVEX!</h1>

        <h2>Employee Leave Portal</h2>

        <p>
            Submit your leave request and get approval.
        </p>

        <button onclick="applyLeave()">
            Apply for Leave
        </button>

        <div id="result">

            <h3>Leave Request Status</h3>

            <p>Your leave details will appear here.</p>

        </div>

    </main>

    <script src="./script.js"></script>

</body>

</html>
