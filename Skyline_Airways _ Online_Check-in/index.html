
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Airways - Online Check-in</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="icon" href="./icons8-online-96.png">
</head>
<body id="home">

<header>
    <div class="logo"><span class="bi bi-airplane-engines-fill"></span> SKYLINE AIRWAYS</div>
    <p>ONLINE CHECK-IN</p>
    <nav>
        <a href="#home">Home</a>
        <a href="#checkin-section">Check-in</a>
        <a href="#result-section">Check_Result</a>
    </nav>
</header>

<main>
   
    <form class="checkin-section" id="checkin-section">
        <h2>Passenger Check-in</h2>

        <label for="passengerName">Passenger Name</label>
        <input type="text" id="passengerName" placeholder="Enter passenger name">

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter age">

        <label for="travelClass">Travel Class</label>
        <select id="travelClass">
            <option value="">Select Travel Class</option>
            <option value="Economy">Economy</option>
            <option value="Business">Business</option>
            <option value="First">First Class</option>
        </select>

        <label for="destination">Destination</label>
        <select id="destination">
            <option value="">Select Destination</option>
            <option value="Dubai">Dubai</option>
            <option value="Singapore">Singapore</option>
            <option value="London">London</option>
        </select>

        <label for="baggage">Baggage Weight (kg)</label>
        <input type="number" id="baggage" placeholder="Enter baggage weight">

        <button type="button" onclick="checkIn()"><span class="bi bi-airplane-engines-fill"></span> CHECK-IN NOW</button>
    </form>
</main>

<section class="result-section" id="result-section">
    <h2>Check-in Status</h2>
    <div id="result">Your check-in result will appear here.</div>
</section>

<footer>
    <p>© 2026 Skyline Airways | Have a safe journey ✈</p>
</footer>

<script src="./script.js"></script>
</body>
</html>
