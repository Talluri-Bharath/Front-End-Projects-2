
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartPay - Welcome</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./Secure_Digital_Wallet_Icon.png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <header>

        <div class="logo">
            SMARTPAY
        </div>

        <div>
            Digital Wallet
        </div>

    </header>

    <section class="hero">

        <div class="welcome-card">

            <div class="icon">
                <span class="bi bi-credit-card-2-back-fill"></span>
            </div>

            <h1>Welcome to SmartPay</h1>

            <p>
                Your smart and simple digital wallet.
                Make payments, manage your balance,
                and enjoy a seamless payment experience.
            </p>

            <div class="features">

                <div><span class="bi bi-check-circle-fill"></span>  Secure Digital Payments</div>

                <div><span class="bi bi-check-circle-fill"></span>  Instant Transactions</div>

                <div><span class="bi bi-check-circle-fill"></span>  Cashback Rewards</div>

            </div>

            <button onclick="startPayment()" class="start-btn">Start Payment</button>

        </div>

    </section>

    <footer>
        SmartPay | Digital Wallet Simulator
    </footer>

    <script src="./script.js"></script>

</body>
</html>
