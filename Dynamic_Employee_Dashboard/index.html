<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Employee Dashboard</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body
        {
            background-color: black;
        }
        .card
        {
           background-color: rgb(184, 216, 181);
            margin: 40px;
            border: 2px solid black;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 10px 10px 10px black;
        }
        .card h2,.card p{
               color: rgb(15, 32, 26);
               text-shadow: 5px 5px 5px rgb(99, 97, 97);
              
        }

        .card p{
             margin-top: 10px;
              font-size: 20px;
              font-weight: bold;
        }


        .form-area
        {
            background-color: rgb(184, 216, 181);
            width: 400px;
            border-radius: 5px;
            margin: auto;
            margin-top: 30px;
            padding: 20px;
         

        }
        label
        {   
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
        input
        {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            margin-top: 5px;
        }

        button
        {
            width: 100%;
            padding: 10px;
            border: none;
            margin-top: 15px;
            background-color:rgb(15, 60, 45);
            border-radius: 5px;
            color: white;
        }
    </style>
</head>
<body>
    
    <div class="form-area">
        <label for="employeeName">Employee Name</label>
        <input type="text" id="employeeName" placeholder="Employee Name">

    
        <label for="employeeRole">Employee Role</label>
        <input type="text" id="employeeRole" placeholder="Employee Role">

        <button onclick="addEmployee()">Add Employee</button>
    </div>


<div id="employeeContainer"></div>
    
    <script>
        function addEmployee() {

    let name = document.querySelector("#employeeName").value;
    let role = document.querySelector("#employeeRole").value;

    let card = document.createElement("div");
    card.className = "card";

    let employeeName = document.createElement("h2");
    employeeName.textContent ="Employee Name: "+name;

    let employeeRole = document.createElement("p");
    employeeRole.textContent ="Employee Role: "+role;

    card.appendChild(employeeName);
    card.appendChild(employeeRole);

    document.querySelector("#employeeContainer").appendChild(card);
}
    </script>
</body>
</html>
