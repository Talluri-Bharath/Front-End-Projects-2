<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>🎵 TuneBox</h1>
        <p>Your Simple Music Playlist</p>
    </header>
    <main>
        <section>
            <div class="section-heading">
                    <h2>My playList</h2>
                    <span id="songCount">0 Songs</span>
            </div>

            <div class="section-songs" id="sectionSongs">

                
            </div>
        </section>

        <section class="controls-section">
            <h2>Playlist Controls</h2>
            <div class="controls">
                    <button onclick="addSong()">Add Song</button>
                    
                    <button onclick="removeSong()">Remove Song</button>
                    
                    <button onclick="sortSongs()">Sorting[A-Z]</button>
                    
                    <button onclick="reverseSongs()">Reverse</button>
            </div>
        </section>

        <section class="recent-section">
            <h2>Recent Songs</h2>
            
            <div class="recent-songs" id="recentSongs">
                
            </div>
        </section>

        <section class="summary-section">
            <h2>Playlist Summary</h2>
            
            <div class="playList-summery" >
                <p id="playListSummery">Your playlist is empty.</p>
            </div>
        </section>
    </main>
    
    <footer>
        <p>🎧 TuneBox © 2026</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
